name: Release

# Disable permissions for all available scopes by default.
permissions: {}

on:
  release:
    types:
      - published

jobs:
  # Builds the distributable plugin zip and attaches it to the GitHub Release.
  #
  # The zip is built with `wp-scripts plugin-zip`. Because package.json has a
  # `files` field, plugin-zip selects what ships via npm-packlist from that field
  # (a `.distignore` is NOT consulted while the field exists). The result is a
  # single top-level `webmcp-adapter/` directory so the file installs cleanly via
  # Plugins -> Add New -> Upload Plugin.
  #
  # Unlike the abilities-catalog release, there is no `composer install` step:
  # this plugin has no Composer dependencies (includes are loaded with plain
  # require_once) and ships no vendor/ directory. The raw src/*.js is served
  # as-is, so there is no build step either.
  build-zip:
    name: Build and attach plugin zip
    runs-on: ubuntu-24.04
    permissions:
      # Required to upload the asset to the release.
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Verify plugin version matches release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' webmcp-adapter.php | head -n1 | tr -d '[:space:]')"
          constant="$(sed -n "s/.*WEBMCP_ADAPTER_VERSION'[, ]*'\([^']*\)'.*/\1/p" webmcp-adapter.php | head -n1)"
          echo "tag=$tag header=$header constant=$constant"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ]; then
            echo "::error::Release tag ($tag) does not match plugin header ($header) and/or WEBMCP_ADAPTER_VERSION ($constant). Bump the version before releasing."
            exit 1
          fi

      - name: Build plugin zip
        run: npm run plugin-zip

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" webmcp-adapter.zip --clobber
